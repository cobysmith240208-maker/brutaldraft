<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="Picture3.png">

<title>BrutalDraft</title>

<style>

:root{
    --bg:#111;
    --text:#f4f4f4;
    --panel:#1d1d1d;
    --button:#2b2b2b;
    --button-hover:#444;
    --warning:#b00020;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

html,
body{
    margin:0;
    min-height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:Georgia,serif;
    overflow-y:auto;
}

#toolbar{
    position:fixed;
    top:0;
    left:0;
    right:0;

    height:60px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 20px;

    background:var(--panel);

    z-index:1000;
}

#controls{
    display:flex;
    align-items:center;
    gap:10px;
}

button{
    background:var(--button);
    color:white;
    border:none;
    border-radius:6px;
    padding:10px 14px;
    cursor:pointer;
}

button:hover{
    background:var(--button-hover);
}

#editor{
    position:relative;
    z-index:1;

    width:100%;
    max-width:900px;
    margin:0 auto;

    min-height:300vh;

    outline:none;

    background:transparent;
    color:var(--text);

    font-size:34px;
    line-height:2;

    padding-top:50vh;
    padding-right:40px;
    padding-bottom:50vh;
    padding-left:40px;

    white-space:pre-wrap;
    word-wrap:break-word;

    transition:filter .5s ease;

    text-shadow:
        0 0 2px rgba(255,255,255,.05),
        0 0 8px rgba(255,255,255,.03);
}

#editor:empty::before{
    content:attr(data-placeholder);
    color:#666;
}

.blur{
    filter:blur(10px);
}

#focusMask{
    position:fixed;

    top:60px;
    left:0;
    right:0;
    bottom:0;

    pointer-events:none;
    z-index:500;

    background:
    linear-gradient(
        to bottom,

        rgba(17,17,17,.98) 0%,
        rgba(17,17,17,.92) 25%,
        rgba(17,17,17,.55) 40%,
        rgba(17,17,17,.08) 47%,

        rgba(17,17,17,0) 50%,

        rgba(17,17,17,.08) 53%,
        rgba(17,17,17,.55) 60%,
        rgba(17,17,17,.92) 75%,
        rgba(17,17,17,.98) 100%
    );
}

#warning{
    position:fixed;

    bottom:20px;
    left:50%;

    transform:translateX(-50%);

    background:var(--warning);
    color:white;

    padding:12px 20px;

    border-radius:10px;

    opacity:0;
    pointer-events:none;

    transition:opacity .3s ease;

    z-index:2000;
}

#warning.show{
    opacity:1;
}

</style>
</head>

<body>

<div id="toolbar">

    <div id="controls">

        <strong>
            Words:
            <span id="wordCount">0</span>
        </strong>

        <button id="exportBtn">
            Export TXT
        </button>

        <button id="resetBtn">
            Hard Reset
        </button>

    </div>

    <div>
        Keep Moving Forward
    </div>

</div>

<div
    id="editor"
    contenteditable="true"
    spellcheck="false"
    data-placeholder="Start writing. Editing comes later."
></div>

<div id="focusMask"></div>

<div id="warning">
    You stopped writing. Keep going.
</div>

<script>

const STORAGE_KEY = "brutalDraft";
const BLUR_DELAY = 10000;

const editor = document.getElementById("editor");
const wordCount = document.getElementById("wordCount");
const warning = document.getElementById("warning");
const exportBtn = document.getElementById("exportBtn");
const resetBtn = document.getElementById("resetBtn");

editor.innerText =
    localStorage.getItem(STORAGE_KEY) || "";

updateWordCount();

let blurTimer;

function saveDraft(){

    localStorage.setItem(
        STORAGE_KEY,
        editor.innerText
    );

}

function updateWordCount(){

    const text = editor.innerText.trim();

    const count =
        text.length === 0
        ? 0
        : text.split(/\s+/).length;

    wordCount.textContent = count;

}

function resetBlurTimer(){

    clearTimeout(blurTimer);

    editor.classList.remove("blur");
    warning.classList.remove("show");

    blurTimer = setTimeout(() => {

        editor.classList.add("blur");
        warning.classList.add("show");

    }, BLUR_DELAY);

}

function centerCaret(){

    const selection =
        window.getSelection();

    if(!selection.rangeCount){
        return;
    }

    const range =
        selection.getRangeAt(0).cloneRange();

    range.collapse(true);

    const rect =
        range.getBoundingClientRect();

    if(rect.height === 0){
        return;
    }

    const targetY =
        window.scrollY +
        rect.top -
        (window.innerHeight * 0.5);

    window.scrollTo({
        top:Math.max(0,targetY),
        behavior:"smooth"
    });

}

editor.addEventListener("input", () => {

    saveDraft();
    updateWordCount();
    resetBlurTimer();

    requestAnimationFrame(
        centerCaret
    );

});

editor.addEventListener("keydown", (event) => {

    if(
        event.key === "Backspace" ||
        event.key === "Delete"
    ){
        event.preventDefault();
        return;
    }

    if(
        (event.ctrlKey || event.metaKey)
        &&
        (
            event.key.toLowerCase() === "x" ||
            event.key.toLowerCase() === "z" ||
            event.key.toLowerCase() === "y"
        )
    ){
        event.preventDefault();
    }

});

editor.addEventListener("beforeinput", (event) => {

    const blocked = [

        "deleteContentBackward",
        "deleteContentForward",
        "deleteByCut",
        "historyUndo",
        "historyRedo"

    ];

    if(
        blocked.includes(
            event.inputType
        )
    ){
        event.preventDefault();
    }

});

exportBtn.addEventListener("click", () => {

    const blob = new Blob(
        [editor.innerText],
        {
            type:
            "text/plain;charset=utf-8"
        }
    );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;

    const date =
        new Date()
        .toISOString()
        .slice(0,10);

    a.download =
        `Master_Draft_${date}.txt`;

    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);

    URL.revokeObjectURL(url);

});

resetBtn.addEventListener("click", () => {

    const confirmed = confirm(
        "Delete this draft permanently?"
    );

    if(!confirmed){
        return;
    }

    localStorage.removeItem(
        STORAGE_KEY
    );

    editor.innerText = "";

    updateWordCount();

    alert("Draft deleted.");

});

function moveCaretToEnd(){

    const range =
        document.createRange();

    range.selectNodeContents(
        editor
    );

    range.collapse(false);

    const selection =
        window.getSelection();

    selection.removeAllRanges();
    selection.addRange(range);

}

window.addEventListener("load", () => {

    editor.focus();

    moveCaretToEnd();

    setTimeout(() => {

        centerCaret();
        resetBlurTimer();

    },150);

});

editor.addEventListener("click", () => {

    requestAnimationFrame(
        centerCaret
    );

});

</script>

</body>
</html>
